<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>signals</title>
<style>
  body { font-family: sans-serif; background: #181818; color: #ddd; max-width: 480px; margin: 20px auto; padding: 0 16px; }
  input, button { padding: 8px; margin: 3px 0; }
  #box { margin: 20px 0; padding: 40px 10px; text-align: center; background: #262626; }
  #box.buy { background: #1d4d2b; }
  #box.sell { background: #6b1f1f; }
  #big { font-size: 48px; font-weight: bold; }
</style>
</head>
<body>

<input id="code" placeholder="join code">
<button id="go">connect</button>

<div id="box">
  <div id="big">-</div>
  <div id="small">not connected</div>
</div>

<details>
  <summary>host</summary>
  <input id="key" type="password" placeholder="admin key"><br>
  <input id="stock" placeholder="stock id"><br>
  <input id="note" placeholder="note">
  <input id="delay" type="number" value="10" style="width:60px"><br>
  <button id="buy">send buy</button>
  <button id="sell">send sell</button>
  <div id="msg"></div>
</details>

<script>
var offset = 0, timer, es, ctx

function $(id) { return document.getElementById(id) }

function beep(f, ms) {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)()
  var o = ctx.createOscillator()
  o.frequency.value = f
  o.connect(ctx.destination)
  o.start()
  o.stop(ctx.currentTime + ms / 1000)
}

function run(sig) {
  clearInterval(timer)
  $('box').className = sig.action
  var lastSec = -1

  timer = setInterval(function () {
    var left = sig.fireAt - (Date.now() + offset)
    if (left > 0) {
      var s = Math.ceil(left / 1000)
      $('big').textContent = s
      $('small').textContent = sig.action + ' ' + (sig.note || '')
      if (s <= 3 && s != lastSec) beep(600, 120)
      lastSec = s
    } else {
      $('big').textContent = sig.action.toUpperCase() + ' NOW'
      beep(1000, 400)
      clearInterval(timer)
    }
  }, 100)
}

$('go').onclick = function () {
  if (es) es.close()
  beep(300, 50)
  es = new EventSource('/events?code=' + encodeURIComponent($('code').value))
  es.addEventListener('hello', function (e) {
    offset = JSON.parse(e.data).serverTime - Date.now()
    $('small').textContent = 'connected'
  })
  es.addEventListener('signal', function (e) {
    var sig = JSON.parse(e.data)
    offset = sig.serverTime - Date.now()
    run(sig)
  })
  es.onerror = function () { $('small').textContent = 'connection problem' }
}

function send(action) {
  fetch('/signal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': $('key').value },
    body: JSON.stringify({ action: action, delaySeconds: Number($('delay').value), note: $('note').value, stockId: $('stock').value || null })
  })
    .then(function (r) { return r.json() })
    .then(function (d) { $('msg').textContent = d.ok ? 'sent to ' + d.listeners : d.error })
}

$('buy').onclick = function () { send('buy') }
$('sell').onclick = function () { send('sell') }
</script>
</body>
</html>
